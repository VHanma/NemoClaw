name: Build Fullstack Agent APK
on:
  push:
    branches: [ fullstack-agent-android-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p fullstack-agent-android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FullstackAgent-Android-APK
          path: fullstack-agent-android/app/build/outputs/apk/debug/app-debug.apk
