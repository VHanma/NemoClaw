name: Build Frequency Forge APK

on:
  push:
    paths:
      - 'frequency-forge-android/**'
      - '.github/workflows/build-frequency-forge.yml'
  pull_request:
    paths:
      - 'frequency-forge-android/**'
      - '.github/workflows/build-frequency-forge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: frequency-forge-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare install APK
        run: |
          mkdir -p dist
          cp frequency-forge-android/app/build/outputs/apk/debug/app-debug.apk dist/FrequencyForge-1.1.0.apk
          sha256sum dist/FrequencyForge-1.1.0.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrequencyForge-APK-v1.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
